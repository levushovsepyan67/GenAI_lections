name: Python Tests and Coverage

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests pytest-cov

      - name: Run tests with coverage
        run: |
          cd 3_1_LLM_agent
          pytest tests/test_fallback_model.py --cov=llm_agent.fallback_model --cov-report=xml --

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          
      - name: Generate coverage badge
        run: |
          pip install coverage-badge
          # Переходим в папку, где лежит файл .coverage после тестов
          cd 3_1_LLM_agent
          coverage-badge -o coverage.svg -f
          # Перемещаем готовый бейджик в корень репозитория
          mv coverage.svg ../

      - name: Commit coverage badge
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add coverage.svg
          git commit -m "chore: auto-update coverage badge" || echo "No changes to commit"
          git push origin main